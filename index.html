<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WebRTC Chat</title>
  </head>
  <body>
    <img id="placeholder" hidden>
    <h2>Start your Camera and Microphone</h2>
    <div class="videocontainer">
      <span>
        <h3>Your Stream</h3>
        <video id="localVideo" poster="assets/Tenna_screenshot_Technical_Difficulties.jpg" autoplay playsinline></video>
        <div>
          <img class="icon" id="iconCam" src="assets/material-symbols--video-camera-front-off.svg">
          <img class="icon" id="iconMic" src="assets/material-symbols--mic-off.svg">
          <img class="icon" id="iconShr" src="assets/material-symbols--mimo-disconnect-outline.svg">
        </div>
      </span>
      <span>
        <h3>Remote Stream</h3>
        <video id="remoteVideo" poster="assets/Tenna_screenshot_Technical_Difficulties.jpg" autoplay playsinline></video>
        <audio id="remoteAudioMic" hidden autoplay>
        <audio id="remoteAudioShr" hidden autoplay>
        <div>
          <img class="icon" id="iconCam">
          <img class="icon" id="iconMic">
          <img class="icon" id="iconShr">
        </div>
      </span>
    </div>

    <div class="buttoncontainer">
      <button id="camButton">
      <button id="micButton">
      <button id="shrButton">
    </div>

    <h2>Create a call</h2>
    <button id="callButton">Create</button>
    <p id="idDisplay"></p>
    <button id="copyButton" hidden>Copy ID</button>
    <p id="callStatus"></p>

    <div class="slidercontainer" id="volume" hidden>
      <span>
        <button id="volumeButton">Adjust volume</button>
        <div id="sliders" hidden>
          <h2>User volume</h2>
          <div class="row">
            <img class="icon" id="iconVolLow" src="assets/material-symbols--volume-down.svg">
            <input id="volumeSliderMic" class="slider" type="range" min="0" max="2" value="1" step="0.01" />
            <img class="icon" id="iconVolHigh" src="assets/material-symbols--volume-up.svg">
          </div>
          <h2>Stream volume</h2>
          <div class="row">
            <img class="icon" id="iconVolLow" src="assets/material-symbols--volume-down.svg">
            <input id="volumeSliderShr" class="slider" type="range" min="0" max="2" value="1" step="0.01" />
            <img class="icon" id="iconVolHigh" src="assets/material-symbols--volume-up.svg">
          </div>
        </div>
      </span>
    </div>

    <h2>Join the call</h2>
    <p>Join the call from a different browser window or device</p>
    
    <input id="callInput" />
    <button id="joinButton" disabled>Join</button>
    <p id="answerStatus"></p>

    <h2>End the Call</h2>

    <button id="endButton" disabled>End</button>

    <script type="module" src="/main.js"></script>
  </body>
</html>
